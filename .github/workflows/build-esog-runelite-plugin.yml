name: Build ESOG RuneLite Plugin

on:
  push:
    paths:
      - 'osrs-community-loadout-builder/live-tracker/runelite-plugin/**'
      - '.github/workflows/build-esog-runelite-plugin.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Compile plugin
        run: gradle --no-daemon -p osrs-community-loadout-builder/live-tracker/runelite-plugin clean build

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: ESOG-RuneLite-Plugin-debug
          path: osrs-community-loadout-builder/live-tracker/runelite-plugin/build/libs/*.jar
          if-no-files-found: error
