name: Build ESOG Android APK

on:
  push:
    paths:
      - 'osrs-community-loadout-builder/android-app/**'
      - '.github/workflows/build-esog-android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        run: gradle --no-daemon -p osrs-community-loadout-builder/android-app :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ESOG-Companion-Android-debug
          path: osrs-community-loadout-builder/android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
