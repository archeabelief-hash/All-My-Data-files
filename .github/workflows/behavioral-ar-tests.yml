name: Behavioral AR tests

on:
  pull_request:
    paths:
      - "projects/behavioral-ar/**"
      - ".github/workflows/behavioral-ar-tests.yml"
  push:
    branches: [main]
    paths:
      - "projects/behavioral-ar/**"

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/behavioral-ar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-video.txt
      - run: python -m pytest -q
